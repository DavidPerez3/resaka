name: Build Android MVP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

concurrency:
  group: resaka-android-mvp
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Generate Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk RESAKA-MVP.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RESAKA-MVP-Android
          path: RESAKA-MVP.apk
          if-no-files-found: error
          retention-days: 14
